[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secretcv-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for secretcv.com jobs (search, detail, sectors, cities)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
secretcv-mcp = "secretcv_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secretcv_mcp"]
